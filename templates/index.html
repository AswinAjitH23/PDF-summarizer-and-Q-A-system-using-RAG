<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Document Assistant</title>
    <!-- Modern Font Integration -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --user-bubble: #2563eb;
            --bot-bubble: #f1f5f9;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 850px;
            height: 90vh;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* Header */
        .chat-header {
            padding: 20px 24px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
        }

        .chat-header h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .doc-badge {
            font-size: 0.8rem;
            background: #eff6ff;
            color: var(--primary-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 500;
            border: 1px solid #bfdbfe;
        }

        /* Chat Log */
        .chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .message.user .bubble {
            background-color: var(--user-bubble);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .bubble {
            background-color: var(--bot-bubble);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* Typing Indicator */
        .typing {
            display: none;
            align-self: flex-start;
            background: var(--bot-bubble);
            padding: 12px 18px;
            border-radius: 14px;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .dots {
            display: flex;
            gap: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: blink 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

        /* Input Controls */
        .chat-input-area {
            padding: 16px 24px;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
        <div class="header-info">
            <div class="status-dot"></div>
            <h1>Document Knowledge Assistant</h1>
        </div>
        <div class="doc-badge">📄 Environmental_Conservation_Essay.pdf</div>
    </div>

    <!-- Chat Messages Container -->
    <div class="chat-box" id="chatBox">
        <div class="message assistant">
            <div class="bubble">
                Hello! I am ready to answer your questions based strictly on the uploaded <strong>Environmental Conservation Essay</strong> document. How can I help you today?
            </div>
        </div>
    </div>

    <!-- Loading State -->
    <div class="typing" id="typingIndicator">
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <!-- User Input Section -->
    <div class="chat-input-area">
        <form class="input-wrapper" id="chatForm">
            <input type="text" id="userInput" placeholder="Ask a question about the document..." autocomplete="off">
            <button type="submit">Send</button>
        </form>
        <div class="hint">Answers are strictly derived from the loaded PDF document.</div>
    </div>
</div>

<script>
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    const typingIndicator = document.getElementById('typingIndicator');

    function appendMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender);
        
        const bubbleDiv = document.createElement('div');
        bubbleDiv.classList.add('bubble');
        bubbleDiv.innerText = text;
        
        msgDiv.appendChild(bubbleDiv);
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const query = userInput.value.trim();
        if (!query) return;

        // Append User Message
        appendMessage(query, 'user');
        userInput.value = '';

        // Show Loading Indicator
        typingIndicator.style.display = 'block';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: query })
            });

            const data = await response.json();
            typingIndicator.style.display = 'none';

            if (data.response) {
                appendMessage(data.response, 'assistant');
            } else {
                appendMessage('An error occurred while fetching the response.', 'assistant');
            }
        } catch (err) {
            typingIndicator.style.display = 'none';
            appendMessage('Failed to communicate with the backend server.', 'assistant');
        }
    });
</script>

</body>
</html>
